<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Sign Up &amp; Claim Registration | AquaShield Pro Restoration</title>
  <meta name="description" content="Register your customer account to track active restoration jobs, monitor crew dispatch, and download insurance documentation.">
    <!-- Google Fonts: Outfit (Headings) & Plus Jakarta Sans (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Favicon & Brand Icons -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
</head>
<body>

  <main>
    <section class="auth-page">
      <!-- Top Floating Controls: Dark/Light Mode & RTL -->
      <div class="auth-top-controls">
        <button type="button" class="btn-ctrl theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Dark/Light Mode">
          <span class="theme-icon"><svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></span>
        </button>
        <button type="button" class="btn-ctrl rtl-toggle-btn" aria-label="Toggle RTL" title="Switch LTR / RTL">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
          <span class="label-text">RTL</span>
        </button>
      </div>

      <div class="container" style="max-width: 480px;">
        <div class="auth-card">

          <!-- Brand Logo Header -->
          <div class="auth-brand-header">
            <a href="index.html" class="auth-brand-logo">
              <div class="logo-icon-wrap">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
              </div>
              <div class="logo-text">
                <h3>Aqua<span>Shield</span></h3>
                <p>Emergency Restoration</p>
              </div>
            </a>
          </div>

          <h1 class="auth-card-title">Customer Sign Up</h1>
          <p class="auth-card-subtitle">Register your customer account to track your restoration plan and crew dispatch.</p>

          <form id="customerSignupForm" novalidate>
            <div class="auth-form-group">
              <label for="regName" class="auth-field-label">Full Name <span class="required">*</span></label>
              <div class="auth-input-group">
                <span class="input-icon-box">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </span>
                <input type="text" id="regName" class="auth-field-input" placeholder="e.g. Sarah Connor" required value="Sarah Connor">
              </div>
            </div>

            <div class="auth-form-group">
              <label for="regEmail" class="auth-field-label">Email Address <span class="required">*</span></label>
              <div class="auth-input-group">
                <span class="input-icon-box">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </span>
                <input type="email" id="regEmail" class="auth-field-input" placeholder="client@example.com" required value="client@aquashield.com">
              </div>
            </div>

            <div class="auth-form-group">
              <label for="regPhone" class="auth-field-label">Phone Number <span class="required">*</span></label>
              <div class="auth-input-group">
                <span class="input-icon-box">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                </span>
                <input type="tel" id="regPhone" class="auth-field-input" placeholder="+1 (555) 000-0000" required value="+1 (555) 019-9421">
              </div>
            </div>

            <div class="auth-form-group">
              <label for="regPassword" class="auth-field-label">Password <span class="required">*</span></label>
              <div class="auth-input-group">
                <span class="input-icon-box">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </span>
                <input type="password" id="regPassword" class="auth-field-input" placeholder="Min 6 characters" required minlength="6" value="Restore2026!">
                <button type="button" class="password-toggle-btn" id="toggleRegPassword" aria-label="Toggle password visibility">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>

            <div class="auth-form-group">
              <label for="regConfirmPassword" class="auth-field-label">Confirm Password <span class="required">*</span></label>
              <div class="auth-input-group">
                <span class="input-icon-box">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                </span>
                <input type="password" id="regConfirmPassword" class="auth-field-input" placeholder="Repeat password" required minlength="6" value="Restore2026!">
                <button type="button" class="password-toggle-btn" id="toggleRegConfirmPassword" aria-label="Toggle confirm password visibility">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>

            <div class="auth-checkbox-row">
              <label class="custom-checkbox-label">
                <input type="checkbox" id="regTerms" required checked>
                <span>I agree to the <a href="privacy-terms.html#privacy">Privacy Policy</a> and <a href="privacy-terms.html#terms">Terms of Care</a>.</span>
              </label>
            </div>

            <!-- Inline Alert Message Container -->
            <div id="signupAlertBox" style="display: none; padding: 12px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; margin-bottom: 16px;"></div>

            <button type="submit" class="btn-auth-primary" id="submitSignupBtn">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
              <span id="signupBtnText">Customer Sign Up</span>
            </button>
          </form>

          <div class="auth-bottom-switch">
            <span>Already have an account?</span>
            <a href="login.html" id="linkBottomSwitch">Customer Login</a>
          </div>

          <!-- Back to Website Link (Below Auth Form) -->
          <div class="auth-back-website-row">
            <a href="index.html" class="link-back-website">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              <span>Back to Website</span>
            </a>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    // Password toggles
    function setupPassToggle(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const inp = document.getElementById(inputId);
      if (btn && inp) {
        btn.addEventListener('click', () => {
          const isPassword = inp.getAttribute('type') === 'password';
          inp.setAttribute('type', isPassword ? 'text' : 'password');
          btn.innerHTML = isPassword
            ? `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>`
            : `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;
        });
      }
    }

    setupPassToggle('toggleRegPassword', 'regPassword');
    setupPassToggle('toggleRegConfirmPassword', 'regConfirmPassword');

    const alertBox = document.getElementById('signupAlertBox');
    const nameInput = document.getElementById('regName');
    const emailInput = document.getElementById('regEmail');
    const phoneInput = document.getElementById('regPhone');
    const passInput = document.getElementById('regPassword');
    const confirmInput = document.getElementById('regConfirmPassword');

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      if (isSuccess) {
        alertBox.style.background = '#ecfdf5';
        alertBox.style.color = '#047857';
        alertBox.style.border = '1px solid rgba(16, 185, 129, 0.3)';
      } else {
        alertBox.style.background = '#fef2f2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
      }
    }

    function hideAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
      [nameInput, emailInput, phoneInput, passInput, confirmInput].forEach(inp => {
        if (inp) inp.classList.remove('is-invalid');
      });
    }

    [nameInput, emailInput, phoneInput, passInput, confirmInput].forEach(inp => {
      if (inp) {
        inp.addEventListener('input', () => {
          if (alertBox.style.display !== 'none') hideAlert();
        });
      }
    });

    // Signup Form Submission (Dummy Frontend Registration - No Dashboard Redirection)
    const signupForm = document.getElementById('customerSignupForm');
    const submitBtn = document.getElementById('submitSignupBtn');
    const signupBtnText = document.getElementById('signupBtnText');

    signupForm.addEventListener('submit', (e) => {
      e.preventDefault();

      if (submitBtn.disabled) return;

      const nameVal = nameInput ? nameInput.value.trim() : '';
      const emailVal = emailInput ? emailInput.value.trim() : '';
      const phoneVal = phoneInput ? phoneInput.value.trim() : '';
      const passVal = passInput ? passInput.value : '';
      const confirmVal = confirmInput ? confirmInput.value : '';
      const termsCheckbox = document.getElementById('regTerms');

      // 1. Name validation
      if (!nameVal) {
        showAlert('Please enter your full name.', false);
        if (nameInput) { nameInput.classList.add('is-invalid'); nameInput.focus(); }
        return;
      }
      if (/^[0-9\s.,+_-]+$/.test(nameVal)) {
        showAlert('Full name cannot be purely numeric. Please enter a valid name.', false);
        if (nameInput) { nameInput.classList.add('is-invalid'); nameInput.focus(); }
        return;
      }

      // 2. Email format validation (RFC 5322 regex)
      const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
      if (!emailVal || !emailRegex.test(emailVal)) {
        showAlert('Please enter a valid email address (e.g., client@example.com).', false);
        if (emailInput) { emailInput.classList.add('is-invalid'); emailInput.focus(); }
        return;
      }

      // 3. Phone validation
      if (!phoneVal) {
        showAlert('Please enter your contact phone number.', false);
        if (phoneInput) { phoneInput.classList.add('is-invalid'); phoneInput.focus(); }
        return;
      }
      if (/[a-zA-Z]/.test(phoneVal)) {
        showAlert('Phone number cannot contain alphabetic letters.', false);
        if (phoneInput) { phoneInput.classList.add('is-invalid'); phoneInput.focus(); }
        return;
      }

      // 4. Password validation
      if (!passVal || passVal.length < 6) {
        showAlert('Password must be at least 6 characters in length.', false);
        if (passInput) { passInput.classList.add('is-invalid'); passInput.focus(); }
        return;
      }

      // 5. Confirm password matching
      if (passVal !== confirmVal) {
        showAlert('Passwords do not match. Please verify your password.', false);
        if (confirmInput) { confirmInput.classList.add('is-invalid'); confirmInput.focus(); }
        return;
      }

      // 6. Terms agreement
      if (termsCheckbox && !termsCheckbox.checked) {
        showAlert('Please agree to the Privacy Policy and Terms of Care to register.', false);
        return;
      }

      // Processing dummy registration
      submitBtn.disabled = true;
      submitBtn.style.cursor = 'not-allowed';
      signupBtnText.textContent = 'Simulating Registration...';
      hideAlert();

      setTimeout(() => {
        const randomJobNumber = Math.floor(1000 + Math.random() * 9000);
        const jobId = `AQ-${randomJobNumber}`;

        const dummyUser = {
          name: nameVal,
          email: emailVal.toLowerCase(),
          phone: phoneVal,
          role: 'Property Loss Client',
          jobId: jobId,
          signupTime: new Date().toLocaleTimeString()
        };

        // Store demo account locally for login page simulation
        localStorage.setItem('aquashield_user', JSON.stringify(dummyUser));
        sessionStorage.setItem('aquashield_signup_success', `✓ Account created successfully for ${nameVal}! Please log in with your credentials.`);
        sessionStorage.setItem('aquashield_signup_email', emailVal.toLowerCase());
        sessionStorage.setItem('aquashield_signup_pass', passVal);

        submitBtn.disabled = true;
        submitBtn.style.cursor = 'not-allowed';
        signupBtnText.textContent = 'Account Created! Redirecting to Login...';
        showAlert(`✓ Account created successfully for ${nameVal}! Redirecting to Customer Login...`, true);

        // Redirect to login page (not dashboard)
        setTimeout(() => {
          window.location.href = 'login.html?registered=true';
        }, 700);
      }, 500);
    });
  </script>
</body>
</html>
