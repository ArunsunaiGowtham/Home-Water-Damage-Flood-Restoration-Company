<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Water Droplet Gradient -->
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Highlight Reflection Gradient -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow for 3D Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001833" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="64" height="64" rx="15" fill="url(#shieldBg)" />
  
  <!-- Subtle Border Glow -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />

  <!-- Shield Contour (Pure White Protection Crest) -->
  <path d="M 32 10 C 44 10 49 14 49 23 C 49 37.5 39 47 32 52 C 25 47 15 37.5 15 23 C 15 14 20 10 32 10 Z" 
        fill="#ffffff" 
        filter="url(#shadow)" />

  <!-- Shield Inner Layer (Deep Blue Contrast) -->
  <path d="M 32 13 C 42 13 46 16.5 46 24 C 46 36 37.5 44.5 32 49 C 26.5 44.5 18 36 18 24 C 18 16.5 22 13 32 13 Z" 
        fill="#082f49" />

  <!-- Emergency Water Droplet Inside Shield -->
  <path d="M 32 17 C 32 17 41 28.5 41 34 C 41 39 37 43 32 43 C 27 43 23 39 23 34 C 23 28.5 32 17 32 17 Z" 
        fill="url(#dropGrad)" />

  <!-- Water Droplet Specular Reflection Shine -->
  <path d="M 32 20 C 31 23 27 29 27 34 C 27 36.5 28 38.5 29.5 39.5 C 27.5 38 26 35.5 26 33 C 26 28.5 32 20 32 20 Z" 
        fill="url(#shineGrad)" />

  <!-- Micro Ripple Line / Crest Accent -->
  <path d="M 28 36 C 30 38 34 38 36 36" 
        stroke="#ffffff" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        fill="none" 
        opacity="0.9" />

  <!-- Sparkle / Rapid Restoration Star -->
  <circle cx="34" cy="27" r="1.5" fill="#ffffff" opacity="0.9" />
</svg>
